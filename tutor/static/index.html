<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>전산세무 1급 이론 튜터</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<div id="topbar"></div>
<main>
<div id="ask-panel" class="panel active">
<div id="dash">
  <div class="dash-row dash-row1">
    <section id="today" class="box today-card" aria-label="오늘의 공부"></section>
    <section id="examCard" class="exam-card" aria-label="시험일"></section>
  </div>
  <div class="dash-stats" id="stats" aria-label="공부 현황"></div>
  <div class="dash-row dash-row3">
    <section id="weekPlan" class="box" aria-label="이번 주 계획"><h2>이번 주 계획</h2><div id="weekCells" class="cal-grid week-cells"></div></section>
    <section id="weekLog" class="box" aria-label="지난 7일 기록"></section>
  </div>
</div>
</div>

<div id="analysis" class="panel">
  <div class="row" style="margin-top:0">
    <label class="small">범위 <select id="anScope"><option value="10">최신 10회분</option><option value="all">전체 회차</option></select></label>
    <span id="anInfo" class="small"></span>
  </div>
  <div style="margin-top:8px"><table id="anTable"></table></div>
  <h3 style="font-size:14px;margin-top:18px">공부 순서 <span class="small">회당 예상 손실 = 회당 배점 × (1 − 내 정답률). 푼 문항이 5개 미만인 단원은 정답률을 계산하지 않습니다.</span></h3>
  <table id="soTable"></table>
  <div id="studyRun" style="margin-top:12px"></div>
</div>

<div id="answers" class="panel">
  <div class="row" style="margin-top:0">
    <b>회차·번호 조회</b>
    <input id="lkRound" type="number" placeholder="회차" style="width:80px">
    <input id="lkNumber" type="number" placeholder="번호(1~15)" style="width:110px">
    <button id="lkGo">조회</button>
  </div>
  <div class="row"><b>단원 퀴즈</b>
    <select id="quizUnit"></select>
    <button id="quizGo" class="ghost">문제 받기</button>
  </div>
  <div id="card" style="margin-top:12px"></div>
</div>

<div id="words" class="panel">
  <div class="row" style="margin-top:0">
    <b>문제 속 용어 보기</b>
    <input id="wdRound" type="number" placeholder="회차" style="width:80px">
    <input id="wdNumber" type="number" placeholder="번호(1~15)" style="width:110px">
    <button id="wdGo">불러오기</button>
  </div>
  <div class="small">밑줄 친 용어를 누르면 쉬운 풀이가 나옵니다. 용어 풀이는 읽기 보조용이며 시험 판단 근거가 아닙니다.</div>
  <div id="wdCard" style="margin-top:10px"></div>
  <div id="wdMeaning" class="meaning"></div>
  <div class="row"><b>용어 사전</b> <input id="gq" placeholder="용어·일상어 검색" style="width:220px"></div>
  <div id="gList" style="margin-top:6px"></div>
</div>

<div id="notebook" class="panel">
  <div class="row" style="margin-top:0">
    <b>틀린 문항</b>
    <select id="nbSubject"><option value="">전체 과목</option><option>재무회계</option><option>원가회계</option><option>세무회계</option></select>
    <select id="nbUnit"><option value="">전체 단원</option></select>
    <span id="nbInfo" class="small"></span>
  </div>
  <div id="nbList" style="margin-top:8px"></div>
  <div id="nbCard" style="margin-top:12px"></div>
  <h3 style="font-size:14px">단원별 틀린 횟수</h3>
  <table id="nbCounts"></table>
</div>

<div id="mock" class="panel">
  <div class="row" style="margin-top:0">
    <button id="mockStart">모의고사 시작</button>
    <span class="small">재무 5 · 원가 5 · 세무 5문항(부가세·소득세·법인세 섞음), 문항당 2점 · 30점 만점. 제출 전에는 정답을 보여 주지 않습니다. 이미 맞힌 문항은 뒤로 미룹니다.</span>
  </div>
  <div id="mockBody" style="margin-top:10px"></div>
  <h3 style="font-size:14px">지난 점수 추이</h3>
  <table id="mockHistory"></table>
</div>

</main>
<script src="/static/quizcard.js"></script>
<script src="/static/nav.js"></script>
<script src="/static/ask.js"></script>
<script>
// ---- 화면 전환: 해시로 연다. 해시 없는 / 와 /#ask 는 홈 대시보드(/#ask 는 질문 패널도 연다, ask.js), 나머지는 각 패널(/#answers 등). 메뉴는 nav.js 가 그린다. ----
const PANELS = ["answers", "notebook", "mock", "analysis", "words"];
function showTab(name) {                                         // 코드에서 직접 열 때도 주소(해시)를 맞춘다
  const target = PANELS.includes(name) ? name : "";
  history.replaceState(null, "", location.pathname + location.search + (target ? "#" + target : ""));
  applyHash();
}
function applyHash() {
  const name = location.hash.slice(1);
  const panel = PANELS.includes(name) ? name : "ask";               // ask-panel = 홈 대시보드
  document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === panel || p.id === panel + "-panel"));
  if (name === "notebook") loadNotebook();                           // 패널을 열 때마다 새로 불러오는 것들
  if (name === "mock") loadMockHistory();
}

// ---- 문제 분석 탭 ----
async function loadAnalysis() {
  const { data } = await api("/api/analysis?" + query({ scope: $("anScope").value }));
  $("anInfo").textContent = `분석 회차 ${data.rounds}개 · 문항 ${data.total_questions}개 (배점은 문항당 점수의 합 ÷ 회차 수)`;
  const table = $("anTable");
  table.replaceChildren(el("tr", {}, ...["단원", "출제 문항", "출제 회차", "회차 출제율", "문항 비율", "회당 배점"].map((h) => el("th", { textContent: h }))));
  for (const r of data.rows) {
    table.append(el("tr", {},
      el("td", { textContent: r.label }), el("td", { className: "num", textContent: r.questions }),
      el("td", { className: "num", textContent: r.rounds }),
      el("td", { className: "num", textContent: Math.round(r.appear_rate * 100) + "%" }),
      el("td", { className: "num", textContent: (r.share * 100).toFixed(1) + "%" }),
      el("td", { className: "num", textContent: r.points_per_round })));
  }
}
$("anScope").addEventListener("change", () => { loadAnalysis(); loadStudyOrder(); });

async function loadStudyOrder() {
  const { data } = await api("/api/study_order?" + query({ scope: $("anScope").value }));
  const table = $("soTable");
  table.replaceChildren(el("tr", {}, ...["순서", "단원", "회당 배점", "푼 문항", "내 정답률", "회당 예상 손실", ""].map((h) => el("th", { textContent: h }))));
  data.rows.forEach((r, n) => {
    const go = el("button", { className: "ghost", textContent: "이 단원 5문제 풀기" });
    go.addEventListener("click", async () => {
      const res = await api("/api/quiz_set?" + query({ subject: r.subject, tax: r.tax, unit: r.unit, count: 5 }));
      if (res.ok) runSession(res.data.ids, $("studyRun"), `${r.label} 5문제`);
    });
    const lack = r.status !== "ok";
    table.append(el("tr", {}, el("td", { className: "num", textContent: lack ? "-" : n + 1 }), el("td", { textContent: r.label }),
      el("td", { className: "num", textContent: r.points_per_round }), el("td", { className: "num", textContent: r.solved_questions }),
      el("td", { className: "num", textContent: lack ? "기록 부족" : Math.round(r.accuracy * 100) + "%" }),
      el("td", { className: "num", textContent: lack ? "기록 부족" : r.expected_loss }), el("td", {}, go)));
  });
}

// ---- 기출 답안 탭 ----
let solved = [];
async function loadQuestion(round, number) {
  const { ok, data } = await api("/api/question?" + query({ round, number }));
  if (!ok) { $("card").replaceChildren(el("div", { className: "result-wrong", textContent: data.error })); return; }
  renderCard(data, $("card"));
}
$("lkGo").addEventListener("click", () => loadQuestion($("lkRound").value, $("lkNumber").value));
$("quizGo").addEventListener("click", async () => {
  const [subject, tax, unit] = $("quizUnit").value.split("|");
  const { ok, data } = await api("/api/quiz?" + query({ subject, tax, unit, exclude: solved.join(",") }));
  if (!ok) { solved = []; $("card").replaceChildren(el("div", { className: "notice", textContent: data.error + " (푼 문제 목록을 비웠습니다. 다시 눌러 주세요.)" })); return; }
  solved.push(data.id);
  renderCard(data, $("card"));
});
async function loadUnits() {
  const { data } = await api("/api/units");
  $("quizUnit").replaceChildren(el("option", { value: "||", textContent: "전체 단원" }),
    ...data.units.map((u) => el("option", { value: `${u.subject}|${u.tax}|${u.unit}`, textContent: `${u.label} (${u.count})` })));
  const names = [...new Set(data.units.map((u) => u.unit))].sort();
  $("nbUnit").replaceChildren(el("option", { value: "", textContent: "전체 단원" }), ...names.map((n) => el("option", { value: n, textContent: n })));
}

// ---- 단어 주석 탭 ----
function renderAnnotated(pieces, meanings) {
  const span = el("span");
  for (const p of pieces) {
    if (!p.term) { span.append(p.text); continue; }
    const t = el("span", { className: "term", textContent: p.text });
    t.addEventListener("click", () => {
      const box = $("wdMeaning");
      box.style.display = "block";
      box.replaceChildren(el("b", { textContent: p.term + " : " }), meanings[p.term]);
    });
    span.append(t);
  }
  return span;
}
$("wdGo").addEventListener("click", async () => {
  const { ok, data } = await api("/api/annotated?" + query({ round: $("wdRound").value, number: $("wdNumber").value }));
  const card = $("wdCard");
  $("wdMeaning").style.display = "none";
  if (!ok) { card.replaceChildren(el("div", { className: "result-wrong", textContent: data.error })); return; }
  card.replaceChildren(el("div", { className: "meta", textContent: `${data.id} · ${[data.meta.subject, data.meta.tax, data.meta.unit].filter(Boolean).join(" › ")}` }),
    el("div", { style: "margin:6px 0;font-weight:600" }, renderAnnotated(data.question, data.meanings)),
    ...data.choices.map((c, i) => el("div", { style: "margin:3px 0" }, `${["①", "②", "③", "④"][i] || i + 1} `, renderAnnotated(c, data.meanings))));
});
async function loadGlossary() {
  const { data } = await api("/api/glossary?" + query({ q: $("gq").value }));
  $("gList").replaceChildren(...data.terms.map((t) => el("div", { className: "hit" }, el("b", { textContent: t.term }), " — " + t.meaning)));
}
$("gq").addEventListener("input", loadGlossary);

// ---- 오답노트 탭 ----
async function loadNotebook() {
  const { data } = await api("/api/notebook?" + query({ subject: $("nbSubject").value, unit: $("nbUnit").value }));
  $("nbInfo").textContent = `오답노트에 남은 문항 ${data.items.length}개 (다시 풀어 맞히면 빠집니다)`;
  const list = $("nbList");
  list.replaceChildren(...(data.items.length ? data.items.map((it) => {
    const row = el("div", { className: "hit" }, el("span", { className: "meta", textContent: `${it.id} · ${[it.subject, it.tax, it.unit].filter(Boolean).join(" › ")} · 틀린 횟수 ${it.wrong_count}` }),
                    el("div", { textContent: it.first_line }));
    const again = el("button", { className: "ghost", textContent: "다시 풀기" });
    again.style.marginTop = "4px";
    again.addEventListener("click", async () => {
      const { ok, data: q } = await api("/api/question?" + query({ id: it.id }));
      if (ok) renderCard(q, $("nbCard"), ({ kind }) => { if (kind === "correct") loadNotebook(); });
    });
    row.append(again);
    return row;
  }) : [el("div", { className: "small", textContent: "오답노트가 비어 있습니다." })]));
  const table = $("nbCounts");
  table.replaceChildren(el("tr", {}, ...["단원", "틀린 횟수(누적)", "아직 남은 문항"].map((h) => el("th", { textContent: h }))));
  for (const r of data.unit_counts) table.append(el("tr", {}, el("td", { textContent: r.label }), el("td", { className: "num", textContent: r.wrong_total }), el("td", { className: "num", textContent: r.open_questions })));
}
$("nbSubject").addEventListener("change", loadNotebook);
$("nbUnit").addEventListener("change", loadNotebook);

// ---- 모의고사 탭 ----
let mockAnswers = {};
$("mockStart").addEventListener("click", async () => {
  const { ok, data } = await api("/api/mock/new");
  if (!ok) { $("mockBody").replaceChildren(el("div", { className: "notice", textContent: data.error })); return; }
  mockAnswers = {};
  const ids = data.questions.map((q) => q.id);
  const sheet = el("div", { className: "sheet" });
  const bubbles = [];                                          // 문항별 OMR 칸 4개
  const progress = el("div", { className: "omr-progress", ariaLive: "polite" });
  const refresh = () => {
    ids.forEach((id, n) => bubbles[n].forEach((b, i) => b.classList.toggle("on", mockAnswers[id] === String(i + 1))));
    progress.textContent = `${Object.keys(mockAnswers).length} / ${ids.length} 문항 답함`;
  };
  data.questions.forEach((q, n) => {
    const item = el("div", { className: "hit", id: `mq-${n + 1}` }, el("div", { className: "meta", textContent: `${n + 1}번 · ${q.subject}${q.tax ? " › " + q.tax : ""}` }),
                    el("div", { className: "stem", textContent: q.question_view || q.question }), ...renderTables(q.tables));
    if (q.exam_basis || (q.pre_amend || []).length) item.append(el("div", { className: "basis-row" }, ...basisBadges(q)));
    for (const note of q.tax_notes || (q.tax_notice ? [q.tax_notice] : [])) item.append(el("div", {}, el("span", { className: "taxflag", textContent: note })));
    const buttons = q.choices.map((text, i) => {
      const b = choiceButton(i, text);
      b.addEventListener("click", () => {                       // 제출 전에는 고르기만 한다(채점·정답 표시 없음)
        mockAnswers[q.id] = String(i + 1);
        buttons.forEach((x) => x.classList.toggle("picked", x === b));
        refresh();
      });
      return b;
    });
    bubbles.push(q.choices.map((_, i) => {
      const dot = el("button", { className: "omr-bubble", textContent: String(i + 1), ariaLabel: `${n + 1}번 문항 ${i + 1}번 보기` });
      dot.addEventListener("click", () => buttons[i].click());
      return dot;
    }));
    item.append(...buttons);
    sheet.append(item);
  });
  const submit = el("button", { id: "mockSubmit", textContent: "제출하고 채점하기" });
  submit.addEventListener("click", async () => {
    submit.disabled = true;
    const res = await api("/api/mock/submit", { ids, answers: mockAnswers });
    renderMockResult(res.data);
    loadStudyOrder();
    loadMockHistory(res.data.history);
  });
  const omr = el("table", { className: "omr-table" }, ...ids.map((_, n) => el("tr", {}, el("th", { textContent: n + 1, scope: "row" }), ...bubbles[n].map((b) => el("td", {}, b)))));
  const box = el("div", { className: "mock-layout" }, sheet, el("aside", { className: "omr-panel" }, el("div", { className: "omr-title", textContent: "OMR 답안카드" }), omr, progress, submit));
  refresh();
  $("mockBody").replaceChildren(box);
});
function renderMockResult(r) {
  const box = el("div", { id: "mockResult" });
  box.append(el("div", { className: "result-right", textContent: `점수 ${r.score} / ${r.max_score}점` }),
             el("div", { className: "small", textContent: Object.entries(r.by_subject).map(([s, v]) => `${s} ${v.score}/${v.max}`).join(" · ") }));
  if (!r.wrong.length) box.append(el("div", { textContent: "모두 맞혔습니다." }));
  for (const w of r.wrong) {
    box.append(el("div", { className: "hit" }, el("div", { className: "meta", textContent: `${w.id} · ${w.subject} › ${w.unit} · 내 답 ${w.your_choice || "미응답"} · 정답 ${w.answer}번` }),
                  el("div", { textContent: w.question }), el("div", { className: "explain", textContent: w.explanation })));
  }
  $("mockBody").replaceChildren(box);
}
async function loadMockHistory(known) {
  const history = known || (await api("/api/mock/history")).data.history;
  const table = $("mockHistory");
  table.replaceChildren(el("tr", {}, ...["회차", "날짜", "점수", "재무", "원가", "세무", "직전 대비"].map((h) => el("th", { textContent: h }))));
  for (const h of history) {
    const sub = (name) => `${h.by_subject[name].score}/${h.by_subject[name].max}`;
    table.append(el("tr", {}, el("td", { textContent: h.n }), el("td", { textContent: new Date(h.taken_at * 1000).toLocaleString("ko-KR") }),
      el("td", { className: "num", textContent: `${h.score}/${h.max_score}` }), el("td", { textContent: sub("재무회계") }),
      el("td", { textContent: sub("원가회계") }), el("td", { textContent: sub("세무회계") }),
      el("td", { className: "num", textContent: h.diff === null ? "-" : (h.diff > 0 ? "+" : "") + h.diff })));
  }
}

// ------------------------------------------------------------------ 오늘의 공부 카드(첫 화면 맨 위)
const TASK_HREF = {
  note: (t) => "/study/" + encodeURIComponent(t.unit),
  ox: (t) => "/ox?" + query({ subject: t.subject, tax: t.tax, unit: t.unit, count: t.need || 20 }),
  quiz: (t) => "/ox?" + query({ mode: "quiz", subject: t.subject, tax: t.tax, unit: t.unit, count: t.need || 5 }),
  review: () => "/ox?mode=review",
  mock: () => "/#mock",
};
async function loadToday() {
  const { ok, data } = await api("/api/today");
  const card = $("today");
  if (!ok) { card.replaceChildren(); return; }
  const done = data.tasks.filter((t) => t.done).length;
  const head = el("h2", {}, "오늘의 공부 ", el("span", { id: "todayStatus", className: data.complete ? "today-done" : "small", textContent: data.rest ? data.message : data.complete ? "오늘 완료" : `${done}/${data.tasks.length} 완료` }));
  const list = el("ul", { className: "today-list", id: "todayList" });
  for (const t of data.tasks) {
    const row = el("li", { className: "today-row" + (t.done ? " done" : "") + (t.next ? " next" : "") });
    row.dataset.task = t.key;
    const go = el("a", { className: t.done ? "btn ghost-btn" : "btn", href: TASK_HREF[t.kind](t), textContent: t.kind === "review" ? (t.done ? "복습 열기" : "바로 시작") : t.kind === "note" ? "노트 열기" : "시작" });
    row.append(el("span", { className: "today-check", ariaLabel: t.done ? "완료" : "아직", textContent: t.done ? "✔" : "○" }), el("span", { className: "today-label" }, el("b", { textContent: t.label + " " }), t.detail,
      ...(t.carried ? [" ", el("span", { className: "carry-badge", textContent: t.carried_note })] : []),
      ...(t.next ? [" ", el("span", { className: "next-badge", textContent: "다음 할 일" })] : []),
      el("div", { className: "today-reason small", textContent: t.reason })), go);
    list.append(row);
  }
  const pct = (x) => (x.rate === null ? "-" : Math.round(x.rate * 100) + "%");
  const bars = data.week.map((d) => el("tr", {}, el("td", { textContent: d.date.slice(5) }),
    el("td", { className: "num", textContent: d.ox.n ? `${pct(d.ox)} (${d.ox.right}/${d.ox.n})` : "-" }),
    el("td", { className: "num", textContent: d.quiz.n ? `${pct(d.quiz)} (${d.quiz.right}/${d.quiz.n})` : "-" })));
  const week = el("details", { className: "today-week" }, el("summary", { textContent: "지난 7일 기록" }),
    el("table", { id: "weekTable" }, el("thead", {}, el("tr", {}, el("th", { textContent: "날짜" }), el("th", { textContent: "O/X 정답률" }), el("th", { textContent: "기출 정답률" }))), el("tbody", {}, ...bars)));
  const settings = el("div", { className: "small today-settings-link" }, el("a", { id: "settingsLink", href: "/plan", textContent: "분량 설정은 계획에서" }), " (하루 노트·O/X·기출 개수)");
  const unitLine = data.units.length ? el("div", { id: "todayUnits", className: "today-units" }, "오늘 단원: ",
    ...data.units.flatMap((u, i) => [i ? " · " : "", el("b", { textContent: u.unit }), ` (${u.subject}${u.tax ? " · " + u.tax : ""})`])) : null;
  card.replaceChildren(head, ...(unitLine ? [unitLine] : []),
    el("div", { className: "small", id: "todayMeta" }, "연속 공부 ", el("b", { id: "streakDays", textContent: `${data.streak}일` }), ` · 예정된 복습 ${data.review.waiting}개(아직 날짜 안 됨) · 복습 완료 ${data.review.done}개 · 오늘 ${data.date} · `,
      el("a", { id: "calendarLink", href: data.plan ? "/plan#calendar" : "/plan", textContent: data.plan ? "내 계획(캘린더)" : "계획 세우기" })),
    list, settings, el("div", { className: "small", id: "todayMsg" }));
  $("weekLog").replaceChildren(week);
  renderStats(data);
}

// ------------------------------------------------------------------ 홈 대시보드: 시험 카드·숫자 카드·이번 주 계획(기존 API 값만 쓴다. 기록이 없으면 '-')
const STATE_NAME = { done: "완료", partial: "부분", missed: "미달", rest: "쉬는 날", future: "예정", exam: "시험일", empty: "계획 없음" };
const DOW_NAME = ["일", "월", "화", "수", "목", "금", "토"];
function renderExam(header) {
  const has = header && header.exam_date;
  const d = header ? header.dday : null;
  const big = !has ? "시험일 미정" : d === 0 ? "D-DAY" : d > 0 ? `D-${d}` : `D+${-d}`;
  $("examCard").replaceChildren(el("div", { className: "exam-label", textContent: "시험까지" }), el("div", { id: "examDday", className: "exam-dday", textContent: big }),
    el("div", { id: "examDate", className: "exam-date", textContent: has ? header.exam_date : "시험일을 정하면 계획이 만들어집니다" }),
    el("a", { id: "examLink", className: "btn exam-btn", href: has ? "/plan#calendar" : "/plan", textContent: has ? "계획 보기" : "계획 세우기" }));
}
function renderWeekPlan(cal) {
  const days = cal.days, i = days.findIndex((d) => d.date === cal.today);
  const box = $("weekCells");
  if (i < 0) { box.replaceChildren(); return; }
  box.replaceChildren(...days.slice(i - (i % 7), i - (i % 7) + 7).map((d) => {
    const a = el("a", { className: "cal-cell" + (d.date === cal.today ? " today" : ""), href: "/plan?date=" + d.date + "#calendar" },
      el("span", { className: "d", textContent: `${DOW_NAME[(d.weekday + 1) % 7]} ${d.date.slice(5).replace("-", "/")}` }),
      el("span", { className: "sum", textContent: d.summary || "" }), el("span", { className: "st", textContent: STATE_NAME[d.state] || "" }));
    a.dataset.state = d.state;
    a.dataset.date = d.date;
    return a;
  }));
}
async function renderStats(today) {
  const sum = (k) => today.week.reduce((t, d) => ({ n: t.n + d[k].n, right: t.right + d[k].right }), { n: 0, right: 0 });
  const rate = (x) => (x.n ? Math.round((x.right / x.n) * 100) + "%" : "-");
  const rw = await api("/api/review-week");
  const pct = rw.ok && rw.data.weeks[0].plan_pct !== null ? rw.data.weeks[0].plan_pct + "%" : "-";
  const cards = [["streak", "연속 공부 일수", `${today.streak}일`], ["planPct", "이번 주 계획 달성률", pct], ["oxRate", "O/X 정답률 (최근 7일)", rate(sum("ox"))],
    ["quizRate", "기출 정답률 (최근 7일)", rate(sum("quiz"))], ["dueCount", "오늘 복습할 문제", `${today.review.due_count}개`]];
  $("stats").replaceChildren(...cards.map(([key, label, value]) => {
    const c = el("div", { className: "stat", id: "stat-" + key }, el("div", { className: "stat-label", textContent: label }), el("div", { className: "stat-value", textContent: value }));
    c.dataset.stat = key;
    return c;
  }));
}
async function loadDash() {
  const { ok, data } = await api("/api/calendar");
  if (!ok) return;
  renderExam(data.header);
  renderWeekPlan(data);
}
loadToday();
loadDash();

loadAnalysis(); loadStudyOrder(); loadUnits(); loadGlossary(); 
applyHash();
addEventListener("hashchange", applyHash);
try {                                                                // 다른 화면의 질문 패널에서 '문제·해설 열기'로 넘어온 경우
  const pending = JSON.parse(sessionStorage.getItem("openQuestion") || "null");
  sessionStorage.removeItem("openQuestion");
  if (pending) { showTab("answers"); loadQuestion(pending[0], pending[1]); }
} catch (e) { /* 무시 */ }
</script>
