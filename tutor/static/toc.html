<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>문제 목차 · 전산세무 1급 이론</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<div id="topbar"></div>
<main>
<h1>문제 목차</h1>
<div class="small">전체 회차 이론 문항을 과목 › 단원으로 묶었습니다. 문제 줄을 누르면 그 자리에서 풀 수 있고, 정답은 풀기 전에는 보이지 않습니다.</div>
<div id="toc" style="margin-top:12px"></div>
</main>
<script src="/static/quizcard.js"></script>
<script src="/static/nav.js"></script>
<script>
(async () => {
  const { data } = await api("/api/toc");
  const root = $("toc");
  for (const subject of data.toc) {
    const box = el("details", { className: "subject" }, el("summary", { textContent: `${subject.subject} · ${subject.count}문항` }));
    for (const unit of subject.units) {
      const d = el("details", {}, el("summary", { textContent: `${unit.label} · ${unit.count}문항 · ${unit.round_count}개 회차 출제` }));
      for (const it of unit.items) {
        const slot = el("div", { className: "slot" });
        slot.hidden = true;
        const row = el("button", { className: "qrow", textContent: `${it.id}  ${it.first_line}` });
        row.addEventListener("click", async () => {
          if (!slot.hidden) { slot.hidden = true; return; }          // 다시 누르면 접는다
          if (!slot.childElementCount) {
            const res = await api("/api/question?" + query({ id: it.id }));
            if (!res.ok) return;
            renderCard(res.data, slot);
          }
          slot.hidden = false;
        });
        d.append(row, slot);
      }
      box.append(d);
    }
    root.append(box);
  }
})();
</script>
</body>
</html>
